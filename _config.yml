title: Bolin
description: 图形渲染与 GPU 优化的个人博客与简历
# 推送前把下面两行改成你的信息;仓库名为 <用户名>.github.io 时 url 填 https://<用户名>.github.io,baseurl 留空
url: "https://bolin12.github.io"
baseurl: ""
lang: zh-CN
author: Bolin
tagline: 图形渲染 / GPU 优化 · 正在学习实时渲染与神经材质
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
minima:
  social_links:
    github: bolin12
header_pages:
  - projects.md
  - blog.md
  - resume.md
  - about.md
show_excerpts: true
# Authoring notes are hidden on the published site. The local preview (scripts/preview.ps1) turns them on
# through _config_local.yml.
show_notes: false
# drafts/ is left out of the published site and put back by _config_local.yml for the local preview.
# Keep the two exclude lists in step (the local one is the same list without drafts/).
exclude:
  - drafts/
  - resume/
  - scripts/
  - README.md
  - NOTES.md
  - vendor/
  - .bundle/
  - Gemfile
  - Gemfile.lock
  - _site_local/
  - _site_public/
  - _site_preview/

