            text: 固定渲染环境并批量计时，用 nvidia-smi 采样 GPU 时钟识别降频；归档 190 份报告、33 个 2048px 实验、4 套测量协议。
          - label: 可比性处理
            text: 发现并处理两类“不可比”：测量协议不同（1024px 逐帧约 109 ms 与 2048px 批量约 17 ms），以及会话漂移（未改动的对照材质在 7.7–8.8 ms 间波动约 15%）；回归检查改用相对对照材质的耗时比值。
          - label: 回归检查
            text: 钉基线加 5% 容差检查，超限返回非零退出码可接 CI；人为放大 15% 的数据被识别为 +14.0%。

