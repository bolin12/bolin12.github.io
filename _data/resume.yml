    items:
      - title: 神经材质（Neural BSDF）在 UE 的适配与优化
        page: /projects/neural-bsdf-perf/
        note: （按你的想法把两条合并；起止时间取较早的 2026.06；性能基准部分的细节在项目页）
        date: 2026.06–至今
        points:
          - label: 适配与优化
            text: 将神经材质接入 Unreal Engine 并做性能优化。
            # TODO(补充): 这一条原文只有一句，需要展开 —— 推理耗时、与 baseline 对比、效果图、
            #             用了哪些优化手段（如 packed-fp16、tensor core 可行性评估）
          - label: 基准与归档
            text: 固定渲染环境并批量计时，用 nvidia-smi 采样 GPU 时钟识别降频；归档 190 份报告、33 个 2048px 实验、4 套测量协议。
          - label: 可比性处理
            text: 发现并处理两类“不可比”：测量协议不同（1024px 逐帧约 109 ms 与 2048px 批量约 17 ms），以及会话漂移（未改动的对照材质在 7.7–8.8 ms 间波动约 15%）；回归检查改用相对对照材质的耗时比值。
          - label: 回归检查
            text: 钉基线加 5% 容差检查，超限返回非零退出码可接 CI；人为放大 15% 的数据被识别为 +14.0%。
          - label: 延伸：GPU 推理
            # TODO(补充): 每一块各挑 1 个你最有把握的结论或数字（成本模型、精度、执行路径、测量方法）
            text: 围绕神经求值沉淀出 GPU 推理的知识体系：成本模型（寄存器占用）、数据与精度（latent 图集、packed fp16）、执行路径（内联与独立 pass、Wave/Tensor Core 可行性）、基准与 GPU Trace 方法。

