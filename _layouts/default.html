<!DOCTYPE html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      {% if page.show_email %}<span class="header-note">{{ site.data.resume.email }}{% if page.lang_url %} · <a href="{{ page.lang_url | relative_url }}">{{ page.lang_label }}</a>{% endif %}</span>{% endif %}
      <nav>
        {% for item in site.data.nav %}
          <a href="{{ item.url | relative_url }}"{% if page.nav == item.key %} class="active" aria-current="page"{% endif %}>{{ item.title }}</a>
        {% endfor %}
      </nav>
    </div>
  </header>
  <main class="wrap">
    {{ content }}
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <span>&copy; {{ 'now' | date: '%Y' }} {{ site.author | default: site.title }}</span>
      <span><a href="https://github.com/{{ site.minima.social_links.github }}">GitHub</a></span>
    </div>
  </footer>
</body>
</html>
