---
layout: default
---
<article class="post">
  <header>
    <h1 class="page-title">{{ page.title }}</h1>
    <p class="meta">
      {{ page.date | date: "%Y-%m-%d" }} · {{ content | number_of_words | divided_by: 300 | plus: 1 }} 分钟阅读
      {% for t in page.tags %}<span class="tag">{{ t }}</span>{% endfor %}
    </p>
  </header>
  {{ content }}
</article>
