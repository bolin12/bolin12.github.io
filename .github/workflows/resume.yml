name: Site and resume

on:
  push:
    branches: [main, resume-pipeline]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  site:
    # Catches Liquid/YAML mistakes before GitHub Pages builds the same sources.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
      - run: bundle install
      - run: bundle exec jekyll build

  resume:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml

      # No phone number here: the PDF is published, so it is as public as the page.
      - name: Generate main.tex
        run: python scripts/build_resume.py

      - uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: resume
          latexmk_use_xelatex: true

      - uses: actions/upload-artifact@v4
        with:
          name: resume-pdf
          path: resume/main.pdf

      - name: Publish PDF and main.tex (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p assets
          cp resume/main.pdf assets/resume.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resume/main.tex assets/resume.pdf
          if git diff --cached --quiet; then
            echo "nothing to publish"
          else
            git commit -m "Update generated resume.tex and resume.pdf"
            git push
            # Pushes made with the workflow token do not start the Pages build by themselves.
            curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/pages/builds"
          fi
