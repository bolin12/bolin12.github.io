name: Site check and resume tex

# GitHub Pages builds and publishes the site by itself. This workflow does two extra things when the resume
# or the pages change:
#   check     builds the site the way Pages does and fails if anything private (notes, to-dos, drafts,
#             contact details, source files) ended up in the output
#   generate  regenerates resume/main.tex and resume/main_en.tex. No PDF is built here: copy resume/ into
#             Overleaf (main.tex + resume.cls for Chinese, main_en.tex for English) and compile it there.
on:
  push:
    branches: [main]
    paths:
      - _data/**
      - _includes/**
      - _layouts/**
      - _config*.yml
      - "*.md"
      - en/**
      - projects/**
      - scripts/**
      - .github/workflows/resume.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
      - run: bundle install
      - run: bundle exec jekyll build
      - run: python3 scripts/check_public_output.py _site .

  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      # No phone number here: the repository is public.
      - run: python scripts/build_resume.py --lang zh
      - run: python scripts/build_resume.py --lang en
      - name: Commit the generated files if they changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resume/main.tex resume/main_en.tex
          if git diff --cached --quiet; then
            echo "generated files are up to date"
          else
            git commit -m "Update generated resume .tex files"
            git push
          fi
