name: Resume tex

# Only runs when the resume sources change. No PDF is built here: copy resume/ into Overleaf
# (main.tex + resume.cls for Chinese, main_en.tex for English) and compile it there.
on:
  push:
    branches: [main]
    paths:
      - _data/resume.yml
      - _data/resume_en.yml
      - resume.md
      - en/resume.md
      - _includes/resume.html
      - scripts/build_resume.py
      - .github/workflows/resume.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  site:
    # Catches Liquid/YAML mistakes before GitHub Pages builds the same sources.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
      - run: bundle install
      - run: bundle exec jekyll build

  tex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      # No phone number here: the repository is public.
      - run: python scripts/build_resume.py --lang zh
      - run: python scripts/build_resume.py --lang en
      - name: Commit the generated .tex files if they changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resume/main.tex resume/main_en.tex
          if git diff --cached --quiet; then
            echo "generated files are up to date"
          else
            git commit -m "Update generated resume .tex files"
            git push
          fi
